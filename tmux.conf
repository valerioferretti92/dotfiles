# ==============================================================================
# TMUX CONFIGURATION
# ==============================================================================

# ------------------------------------------------------------------------------
# Prefix Key
# ------------------------------------------------------------------------------
# Remap default prefix from C-b to C-Space (much easier to reach)
unbind-key C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# ------------------------------------------------------------------------------
# General Options & Terminal
# ------------------------------------------------------------------------------
# Set default terminal inside tmux
set-option -g default-terminal "tmux-256color"

# Enable true color (24-bit RGB) support across any outer terminal emulator (Alacritty, Kitty, etc.)
set-option -sa terminal-features ',*:RGB'

# Reduce escape time to 10ms to eliminate delay after pressing ESC in Neovim/Vim
set-option -sg escape-time 10

# Pass through focus events to applications running inside tmux (required for Neovim FocusGained/Lost)
set-option -g focus-events on

# Increase scrollback history limit (default is 2,000 lines)
set-option -g history-limit 50000

# Start window and pane numbering at 1 instead of 0 for easier keyboard reach
set-option -g base-index 1
set-option -g pane-base-index 1
set-window-option -g pane-base-index 1

# Renumber windows automatically when one is closed to maintain contiguous numbers
set-option -g renumber-windows on

# Status bar refresh rate in seconds
set-option -g status-interval 1

# Automatically rename windows to the basename of the current working directory
# Note: Manually renaming a window (Prefix + r) will lock its name until cleared
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# ------------------------------------------------------------------------------
# Status Bar Position
# ------------------------------------------------------------------------------
set-option -g status on
set-option -g status-position top

# ------------------------------------------------------------------------------
# Mouse & Scrolling
# ------------------------------------------------------------------------------
# Enable mouse support (scrolling, clicking, resizing panes)
set-option -g mouse on

# Disable the right-click context menu so it doesn't interrupt terminal workflows
unbind-key -n MouseDown3Pane

# ------------------------------------------------------------------------------
# Colors & Styles
# ------------------------------------------------------------------------------
# Invert colors for selections in copy mode
set-option -g mode-style "reverse"

# ------------------------------------------------------------------------------
# Window & Pane Management
# ------------------------------------------------------------------------------
# Unbind default split keys ('"' and '%')
unbind-key '"'
unbind-key %

# Split panes preserving the current pane's working directory
# Prefix + h: split horizontally (top / bottom)
# Prefix + v: split vertically (left / right)
bind-key h split-window -v -c "#{pane_current_path}"
bind-key v split-window -h -c "#{pane_current_path}"

# Open new windows in the current pane's working directory
bind-key c new-window -c "#{pane_current_path}"

# Kill current pane with Prefix + k
bind-key k kill-pane

# ------------------------------------------------------------------------------
# Session Management
# ------------------------------------------------------------------------------
# Detach session with Prefix + d
unbind-key 'D'
bind-key 'd' detach

# ------------------------------------------------------------------------------
# Configuration Reload
# ------------------------------------------------------------------------------
# Reload tmux config with Prefix + s and show a confirmation prompt
# Note: default 's' is choose-tree (session picker); use 'Prefix + w' for the interactive window/session tree
unbind-key s
bind-key s source-file ~/.tmux.conf \; display-message "tmux.conf reloaded!"

# ------------------------------------------------------------------------------
# Window Renaming
# ------------------------------------------------------------------------------
# Prompt to rename current window with Prefix + r
unbind-key r
bind-key r command-prompt -I "rename-window "

# ------------------------------------------------------------------------------
# Copy Mode (Vi Keybindings)
# ------------------------------------------------------------------------------
# Enter copy mode with Prefix + a
bind-key a copy-mode

# Enable vi keys in copy mode (h, j, k, l, /, ?, etc.)
set-window-option -g mode-keys vi

# Vi-style selection in copy mode
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'C-v' send-keys -X rectangle-toggle

# ------------------------------------------------------------------------------
# Extended Keys
# ------------------------------------------------------------------------------
# Enable extended key reporting (CSI u format) for modern terminal key combinations (Pi agent)
set-option -g extended-keys on
set-option -g extended-keys-format csi-u

# ------------------------------------------------------------------------------
# Plugins (TPM)
# ------------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Plugin settings: tmux-yank
set -g @yank_action 'copy-pipe'
set -g @yank_selection_mouse 'clipboard'

# Theme: Dracula
set -g @plugin 'dracula/tmux'
set -g @dracula-plugins "cpu-usage ram-usage time"

# ------------------------------------------------------------------------------
# TPM Bootstrap & Initialization
# ------------------------------------------------------------------------------
# Automatically install TPM if not present when starting tmux on a new machine
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
